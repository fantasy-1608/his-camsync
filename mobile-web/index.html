<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HIS CamSync - Chụp & Đồng Bộ ECG</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
      <span>HIS CamSync</span>
    </div>
    <div id="statusBadge" class="status-badge">
      <span class="status-dot"></span>
      <span id="statusText">Đang kết nối...</span>
    </div>
  </header>

  <!-- Patient Context Banner -->
  <div id="patientBanner" class="patient-banner" style="display: none; background: #0c1524; border-bottom: 1px solid #1e293b; padding: 6px 16px; font-size: 13px; color: #38bdf8; align-items: center; gap: 8px;">
    <span>🩺</span>
    <span id="patientBannerText" style="font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">...</span>
  </div>

  <!-- Main View -->
  <main class="main-view">
    <!-- Screen 1: Chụp ảnh -->
    <section id="captureScreen" class="capture-screen">
      <div class="capture-icon-box">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
      </div>
      <div>
        <h2 class="capture-title">Chụp Dải Băng ECG</h2>
        <p class="capture-subtitle">Chụp trực tiếp bằng camera, xoay và cắt dải sóng để đồng bộ tức thì vào bệnh án HIS.</p>
      </div>

      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
      <button id="btnTriggerCapture" class="btn-large-capture">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <span>Chụp Ảnh Mới</span>
      </button>
    </section>

    <!-- Screen 2: Chỉnh sửa & Xử lý ảnh -->
    <section id="editorScreen" class="editor-screen">
      <div class="canvas-viewport">
        <div id="canvasContainer" class="canvas-container">
          <canvas id="previewCanvas"></canvas>
          <div id="cropOverlay" class="crop-overlay">
            <div id="cropBox" class="crop-box">
              <div class="crop-grid">
                <div></div><div></div><div></div>
                <div></div><div></div><div></div>
                <div></div><div></div><div></div>
              </div>
              <div class="crop-handle handle-tl" data-handle="tl"></div>
              <div class="crop-handle handle-tr" data-handle="tr"></div>
              <div class="crop-handle handle-bl" data-handle="bl"></div>
              <div class="crop-handle handle-br" data-handle="br"></div>
              <div class="crop-edge-handle handle-t" data-handle="t"></div>
              <div class="crop-edge-handle handle-b" data-handle="b"></div>
              <div class="crop-edge-handle handle-l" data-handle="l"></div>
              <div class="crop-edge-handle handle-r" data-handle="r"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Controls & Tools -->
      <div class="editor-controls">
        <div class="tools-row">
          <button id="btnRotateLeft" class="tool-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
            <span>Trái 90°</span>
          </button>

          <button id="btnRotateRight" class="tool-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
              <path d="M21 3v5h-5"></path>
            </svg>
            <span>Phải 90°</span>
          </button>

          <button id="btnFilterNormal" class="tool-btn active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
            <span>Màu gốc</span>
          </button>

          <button id="btnFilterEcg" class="tool-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
            <span>Nét sóng ECG</span>
          </button>
        </div>

        <div class="actions-row">
          <button id="btnRetake" class="btn-secondary">Chụp Lại</button>
          <button id="btnSendToHis" class="btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            <span id="btnSendText">Gửi Lên HIS</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="notification-toast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span>Đã gửi thành công lên máy tính!</span>
  </div>

  <!-- Scripts -->
  <script src="js/vendor/peerjs.min.js"></script>
  <script type="module">
    import { ImageEditor } from './js/editor.js';
    import { P2PClient } from './js/p2p-client.js';

    // Elements
    const captureScreen = document.getElementById('captureScreen');
    const editorScreen = document.getElementById('editorScreen');
    const cameraInput = document.getElementById('cameraInput');
    const btnTriggerCapture = document.getElementById('btnTriggerCapture');
    const canvas = document.getElementById('previewCanvas');
    const canvasContainer = document.getElementById('canvasContainer');
    const cropOverlay = document.getElementById('cropOverlay');
    const cropBox = document.getElementById('cropBox');

    const btnRotateLeft = document.getElementById('btnRotateLeft');
    const btnRotateRight = document.getElementById('btnRotateRight');
    const btnFilterNormal = document.getElementById('btnFilterNormal');
    const btnFilterEcg = document.getElementById('btnFilterEcg');
    const btnRetake = document.getElementById('btnRetake');
    const btnSendToHis = document.getElementById('btnSendToHis');
    const btnSendText = document.getElementById('btnSendText');

    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const toast = document.getElementById('toast');

    // Khởi tạo Editor & P2P Client
    const editor = new ImageEditor(canvas, canvasContainer, cropOverlay, cropBox);
    const p2p = new P2PClient({
      onStatusChange: (connected, text) => {
        statusText.textContent = text;
        if (connected) {
          statusBadge.classList.remove('disconnected');
          btnSendToHis.disabled = false;
          btnSendText.textContent = 'Gửi Lên HIS';
        } else {
          statusBadge.classList.add('disconnected');
          btnSendToHis.disabled = true;
          btnSendText.textContent = 'Chờ kết nối máy tính...';
        }
      },
      onPatientInfo: (patient) => {
        const banner = document.getElementById('patientBanner');
        const text = document.getElementById('patientBannerText');
        if (patient && patient.name) {
          text.textContent = `${patient.name} (${patient.id})${patient.age ? ' - ' + patient.age : ''}`;
          banner.style.display = 'flex';
        }
      }
    });

    p2p.connect();

    // Trigger Camera
    btnTriggerCapture.addEventListener('click', () => {
      cameraInput.click();
    });

    cameraInput.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      try {
        await editor.loadImage(file);
        captureScreen.style.display = 'none';
        editorScreen.style.display = 'flex';
        // Render lại sau khi layout tính toán xong kích thước
        setTimeout(() => editor.render(), 50);
      } catch (err) {
        alert('Không thể tải ảnh: ' + err.message);
      }
    });

    // Rotation
    btnRotateLeft.addEventListener('click', () => editor.rotate(-90));
    btnRotateRight.addEventListener('click', () => editor.rotate(90));

    // Filters
    btnFilterNormal.addEventListener('click', () => {
      editor.setFilter('normal');
      btnFilterNormal.classList.add('active');
      btnFilterEcg.classList.remove('active');
    });

    btnFilterEcg.addEventListener('click', () => {
      editor.setFilter('ecg');
      btnFilterEcg.classList.add('active');
      btnFilterNormal.classList.remove('active');
    });

    // Retake
    btnRetake.addEventListener('click', () => {
      cameraInput.value = '';
      editorScreen.style.display = 'none';
      captureScreen.style.display = 'flex';
    });

    statusBadge.addEventListener('click', () => {
      if (!p2p.isConnected) {
        statusText.textContent = 'Đang thử lại...';
        p2p.connectToDesktop();
      }
    });

    // Send to HIS
    btnSendToHis.addEventListener('click', async () => {
      if (!p2p.isConnected) {
        btnSendText.textContent = 'Đang thử kết nối lại...';
        p2p.connectToDesktop();
        return;
      }
      try {
        btnSendToHis.disabled = true;
        btnSendText.textContent = 'Đang nén ảnh...';

        const blob = await editor.exportBlob(0.85);
        btnSendText.textContent = 'Đang truyền 0%...';

        await p2p.sendImage(blob, {
          name: `ECG_${Date.now()}.jpg`,
          type: 'image/jpeg'
        }, (pct) => {
          btnSendText.textContent = `Đang truyền ${pct}%...`;
        });

        // Rung nhẹ điện thoại xác nhận thành công
        if (navigator.vibrate) {
          try { navigator.vibrate([40, 60, 40]); } catch (e) {}
        }

        // Show Toast
        toast.classList.add('visible');
        setTimeout(() => {
          toast.classList.remove('visible');
          // Reset về màn hình chụp cho ca tiếp theo
          cameraInput.value = '';
          editorScreen.style.display = 'none';
          captureScreen.style.display = 'flex';
          btnSendToHis.disabled = false;
          btnSendText.textContent = 'Gửi Lên HIS';
        }, 1500);
      } catch (err) {
        alert(err.message || 'Lỗi gửi ảnh');
        btnSendToHis.disabled = false;
        btnSendText.textContent = 'Gửi Lên HIS';
      }
    });
  </script>
</body>
</html>
