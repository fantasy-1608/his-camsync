name: CamSync quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:syntax
      - run: npm run test:safety
      - run: npm run test:all
      - run: npm audit --omit=dev --audit-level=high
      - name: Validate extension package
        run: |
          python3 -m json.tool extension/manifest.json >/dev/null
          test -f extension/content/his-adapter.js
          test -f extension/content/clinical-guard.js
          (cd extension && zip -qr ../camsync-extension.zip .)
          unzip -tq camsync-extension.zip
          unzip -Z1 camsync-extension.zip | rg -x manifest.json
          sha256sum camsync-extension.zip > camsync-extension.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: camsync-local-build
          path: |
            camsync-extension.zip
            camsync-extension.sha256
